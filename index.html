  <body>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; color: #2b2925; line-height: 1.6">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem">Мария Левина — психолог</h1>
        <p>Для работы страницы нужен JavaScript. Записаться на сессию можно напрямую:</p>
        <p>Телефон: <a href="tel:+79000000000">+7 (900) 000-00-00</a><br />Почта: <a href="mailto:hello@levina.psy">hello@levina.psy</a></p>
      </div>
    </noscript>
    <div id="root"></div>
    <script>
      // Защита от «белой страницы»: если приложение не запустилось — показываем причину и контакты
      (function () {
        function fallback(reason) {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1.5rem;color:#2b2925;line-height:1.6">' +
            '<h1 style="font-size:1.75rem;margin:0 0 .5rem">Мария Левина — психолог</h1>' +
            "<p>Страница не загрузилась полностью. Записаться на сессию можно напрямую:</p>" +
            '<p>Телефон: <a href="tel:+79000000000">+7 (900) 000-00-00</a><br>Почта: <a href="mailto:hello@levina.psy">hello@levina.psy</a></p>' +
            '<p style="margin-top:2rem;font-size:12px;color:#8f8980">Техническая причина: ' + String(reason).replace(/</g, "&lt;") + "</p></div>";
        }
        window.addEventListener("error", function (e) {
          fallback(e.message || (e.target && (e.target.src || e.target.href) ? "не найден файл " + (e.target.src || e.target.href) : "ошибка скрипта"));
        }, true);
        setTimeout(function () { fallback("приложение не запустилось за 6 секунд"); }, 6000);
      })();
    </script>
